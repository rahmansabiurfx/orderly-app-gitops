# ════════════════════════════════════════════════════════════════
# Production Environment Overrides
# ════════════════════════════════════════════════════════════════

image:
  pullPolicy: IfNotPresent

replicaCount: 3

env:
  APP_NAME: "orderly-app"
  APP_VERSION: "0.3.0"
  ENVIRONMENT: "production"

ingress:
  enabled: true
  className: nginx
  host: orderly-app.prod.local
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70